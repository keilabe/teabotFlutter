name: teabot
description: A tea leaf disease detection app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  image_picker: ^1.0.4
  tflite_flutter: 0.11.0
  path_provider: ^2.1.1
  flutter_image_compress: ^2.0.3
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_app_check: ^0.4.0
  firebase_messaging: ^16.0.0
  firebase_analytics: ^12.0.0
  fl_chart: ^1.0.0
  flutter_svg: ^2.2.0
  sqflite: ^2.4.2
  connectivity_plus: ^6.1.4
  path: ^1.8.3
  font_awesome_flutter: ^10.7.0
  image: ^4.1.3
  http: ^1.2.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  intl: ^0.20.2
  flutter_local_notifications: ^19.4.0
  permission_handler: ^12.0.1
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

dependency_overrides:
  collection: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/model.tflite
    - assets/labels.txt
    - assets/tea_logo.svg
    - assets/images/placeholder_leaf.jpg
